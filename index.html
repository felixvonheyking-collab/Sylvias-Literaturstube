<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sylvia's Gedichteecke</title>
<meta name="description" content="Eigene Gedichte schreiben, sprechen und einscannen — inspiriert von großen Dichtern." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3F6B39" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sylvia's Ecke" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --paper: #F5F1DC;
    --paper-dim: #ECE5C4;
    --ink: #1E2A20;
    --ink-soft: #4B5347;
    --wine: #3F6B39;
    --wine-deep: #274A24;
    --gold: #E4B92E;
    --sage: #6E8B52;
    --amber: #B5651D;
    --rule: rgba(30,42,32,0.14);
    --card: #F9F4DC;
    --shadow: 0 1px 2px rgba(30,42,32,0.06), 0 8px 24px rgba(30,42,32,0.08);
  }
  *{ box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(63,107,57,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(228,185,46,0.08), transparent 55%);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  h1,h2,h3, .display{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .mono{ font-family: "Space Mono", monospace; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  ::selection{ background: var(--gold); color: var(--paper); }

  /* ---------- App shell ---------- */
  #root{ max-width: 640px; margin: 0 auto; min-height: 100vh; position: relative; }

  .topbar{
    position: sticky; top:0; z-index: 20;
    background: rgba(245,241,220,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
    padding: calc(env(safe-area-inset-top) + 14px) 20px 12px;
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
  }
  .topbar .word{
    font-family:"Fraunces", serif; font-weight:700; font-size: 18px; letter-spacing:-0.01em;
    color: var(--wine-deep); line-height:1.15;
  }
  .topbar .word span{ color: var(--gold); }
  .topbar .sub{ font-family:"Space Mono", monospace; font-size:10px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }

  main{ padding: 18px 20px 100px; }

  /* ---------- Bottom nav ---------- */
  .tabbar{
    position: fixed; left:0; right:0; bottom:0; z-index: 30;
    max-width: 640px; margin: 0 auto;
    background: rgba(249,244,220,0.92);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--rule);
    display:flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1; background:none; border:none; padding: 10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--ink-soft); font-family:"Space Mono", monospace; font-size: 10px; letter-spacing:0.03em;
  }
  .tabbar button .ic{ font-size:18px; line-height:1; }
  .tabbar button.active{ color: var(--wine); }
  .tabbar button.active .ic{ transform: translateY(-1px); }

  /* ---------- Section headers ---------- */
  .eyebrow{
    font-family:"Space Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--wine); margin: 0 0 6px;
  }
  .pagetitle{ font-size: 28px; margin: 0 0 4px; }
  .pagesub{ color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; line-height:1.5; }

  hr.ink{ border:none; border-top: 1px solid var(--rule); margin: 22px 0; }

  /* ---------- Author grid ---------- */
  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .authorcard{
    background: var(--card); border-radius: 14px; padding: 16px 14px;
    box-shadow: var(--shadow); border: 1px solid rgba(30,42,32,0.05);
    text-align:left; position: relative; overflow:hidden;
    transition: transform .15s ease;
  }
  .authorcard:active{ transform: scale(0.97); }
  .authorcard .era{
    font-family:"Space Mono", monospace; font-size: 9px; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom:8px; display:block;
  }
  .authorcard .name{ font-family:"Fraunces", serif; font-weight:600; font-size: 17px; line-height:1.15; margin-bottom: 4px;}
  .authorcard .dates{ font-family:"Space Mono", monospace; font-size: 10px; color: var(--ink-soft); }
  .authorcard .pd-badge{
    position:absolute; top:12px; right:12px; width:7px; height:7px; border-radius:50%;
    background: var(--sage);
  }
  .authorcard .pd-badge.locked{ background: var(--amber); }

  /* ---------- Author detail ---------- */
  .backbtn{
    background:none; border:none; font-family:"Space Mono", monospace; font-size:11px;
    color: var(--ink-soft); padding: 0 0 18px; letter-spacing:0.04em; display:flex; align-items:center; gap:6px;
  }
  .authorhead .era{ font-family:"Space Mono", monospace; font-size: 10px; color: var(--gold); text-transform:uppercase; letter-spacing:0.1em; }
  .authorhead h1{ font-size: 30px; margin: 6px 0 2px; }
  .authorhead .dates{ font-family:"Space Mono", monospace; font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }
  .bio{ line-height: 1.7; font-size: 15px; color: var(--ink); }
  .bio p{ margin: 0 0 12px; }

  .marginal{
    margin: 26px 4px 26px 18px; padding: 4px 0 4px 18px;
    border-left: 2px solid var(--gold);
    position: relative;
  }
  .marginal:before{
    content: "„"; position:absolute; left:-2px; top:-14px;
    font-family:"Fraunces", serif; font-size: 46px; color: var(--gold); opacity:0.5;
  }
  .marginal blockquote{
    margin:0; font-family:"Fraunces", serif; font-style: italic; font-weight:500;
    font-size: 17px; line-height:1.5; color: var(--wine-deep); transform: rotate(-0.4deg);
  }
  .marginal cite{ display:block; margin-top:8px; font-family:"Space Mono", monospace; font-style:normal; font-size:10px; color: var(--ink-soft); }

  .pd-note{
    font-size: 12.5px; color: var(--ink-soft); background: rgba(110,139,82,0.10);
    border-radius: 10px; padding: 10px 12px; line-height:1.55; margin: 16px 0;
  }
  .pd-note.locked{ background: rgba(181,101,29,0.09); }

  .fulltext-poem{
    background: var(--card); border-radius: 12px; padding: 16px 18px; margin: 14px 0;
    box-shadow: var(--shadow);
  }
  .fulltext-poem h3{ font-size: 15px; margin:0 0 10px; color: var(--wine-deep); }
  .fulltext-poem p{ font-family:"Fraunces", serif; font-style: italic; font-size: 15px; line-height: 1.9; margin: 0; white-space: pre-line; }

  .linkrow{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 4px; }
  .linkrow a{
    font-family:"Space Mono", monospace; font-size:11px; text-decoration:none;
    border: 1px solid var(--rule); border-radius: 20px; padding: 7px 12px; color: var(--ink);
  }

  .dedicate-btn{
    width:100%; margin-top: 22px; background: var(--wine); color: var(--paper); border:none;
    border-radius: 12px; padding: 14px; font-family:"Space Mono", monospace; font-size: 12px;
    letter-spacing: 0.04em; text-transform: uppercase; box-shadow: var(--shadow);
  }
  .dedicate-btn:active{ background: var(--wine-deep); }

  /* ---------- Poems (Meine Gedichte) ---------- */
  .poemcard{
    background: var(--card); border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 14px;
    box-shadow: var(--shadow); position:relative;
  }
  .poemcard h3{ font-size:17px; margin: 0 0 6px; }
  .poemcard .meta{ font-family:"Space Mono", monospace; font-size: 10px; color: var(--ink-soft); margin-bottom:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .poemcard .meta .src{ background: rgba(228,185,46,0.22); color:#7a5f2e; padding:2px 7px; border-radius: 8px; }
  .poemcard .text{ font-family:"Fraunces", serif; font-style: italic; white-space: pre-line; line-height:1.75; font-size:14.5px; }
  .poemcard .tags{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .tagchip{ font-family:"Space Mono", monospace; font-size:10px; background: rgba(110,139,82,0.16); color: var(--sage); padding:3px 9px; border-radius: 20px; }
  .poemcard .inspired{ font-family:"Space Mono", monospace; font-size:10px; color: var(--wine); margin-top:8px; }
  .poemcard .rowbtns{ position:absolute; top:14px; right:14px; display:flex; gap:6px; }
  .iconbtn{ background:none; border:none; color: var(--ink-soft); font-size:14px; padding:4px; }

  .fab{
    position: fixed; right: 20px; bottom: 82px; z-index: 25;
    width: 54px; height:54px; border-radius: 50%; background: var(--wine); color:var(--paper);
    border:none; font-size: 26px; box-shadow: 0 6px 18px rgba(92,34,48,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform: scale(0.94); }

  .empty{
    text-align:center; padding: 50px 20px; color: var(--ink-soft);
  }
  .empty .ic{ font-size: 30px; margin-bottom:10px; }
  .empty p{ font-size:13px; line-height:1.6; max-width:260px; margin:0 auto; }

  /* ---------- Editor modal ---------- */
  .sheet-overlay{
    position: fixed; inset:0; background: rgba(30,42,32,0.45); z-index: 40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background: var(--paper); width:100%; max-width: 640px; border-radius: 20px 20px 0 0;
    padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y:auto; box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
  }
  .sheet-handle{ width:36px; height:4px; background: var(--rule); border-radius:2px; margin: 0 auto 14px; }
  .sheet h2{ font-size:20px; margin: 0 0 16px; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-family:"Space Mono", monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field textarea, .field select{
    width:100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--card);
    padding: 12px 12px; font-family:"Source Serif 4", serif; font-size:15px; color: var(--ink);
  }
  .field textarea{ min-height: 140px; line-height:1.6; font-family:"Fraunces", serif; font-style:italic; resize: vertical; }
  .inputrow{ display:flex; gap:8px; margin-bottom: 14px; }
  .chipbtn{
    flex:1; border: 1px solid var(--rule); background: var(--card); border-radius: 12px;
    padding: 12px 6px; font-family:"Space Mono", monospace; font-size: 11px; color: var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .chipbtn.recording{ background: var(--wine); color: var(--paper); border-color: var(--wine); }
  .chipbtn .ic{ font-size:18px; }
  .tagpicker{ display:flex; flex-wrap:wrap; gap:8px; }
  .tagpicker button{
    border:1px solid var(--rule); background: var(--card); border-radius: 20px; padding: 7px 13px;
    font-family:"Space Mono", monospace; font-size: 11px; color: var(--ink-soft);
  }
  .tagpicker button.on{ background: var(--sage); border-color: var(--sage); color: var(--paper); }
  .save-btn{
    width:100%; background: var(--wine); color: var(--paper); border:none; border-radius: 12px;
    padding: 15px; font-family:"Space Mono", monospace; font-size: 12px; text-transform:uppercase;
    letter-spacing:0.05em; margin-top: 6px;
  }
  .cancel-btn{
    width:100%; background:none; border:none; color: var(--ink-soft); padding: 12px;
    font-family:"Space Mono", monospace; font-size: 11px; text-align:center;
  }
  .ocr-status{ font-family:"Space Mono", monospace; font-size:11px; color: var(--wine); margin: 4px 0 12px; }
  .photo-preview{ width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-bottom:10px; }

  /* ---------- Timeline ---------- */
  .tl{ position:relative; margin-left: 10px; padding-left: 22px; border-left: 2px solid var(--rule); }
  .tl-item{ position:relative; padding-bottom: 26px; }
  .tl-item:before{
    content:""; position:absolute; left:-28px; top:3px; width:10px; height:10px; border-radius:50%;
    background: var(--amber); border: 2px solid var(--paper);
  }
  .tl-item.mine:before{ background: var(--sage); }
  .tl-item .yr{ font-family:"Space Mono", monospace; font-size:11px; color: var(--gold); }
  .tl-item .ttl{ font-family:"Fraunces", serif; font-weight:600; font-size:15px; margin: 2px 0; }
  .tl-item .desc{ font-size:12.5px; color: var(--ink-soft); line-height:1.5; }

  /* ---------- Install banner ---------- */
  .installbar{
    margin: 0 0 18px; background: var(--card); border-radius: 14px; padding: 14px 16px;
    box-shadow: var(--shadow); font-size: 12.5px; line-height:1.6; display:flex; gap:12px; align-items:flex-start;
  }
  .installbar .ic{ font-size:20px; }
  .installbar button{ background: var(--wine); color:var(--paper); border:none; border-radius:8px; padding:6px 12px; font-family:"Space Mono", monospace; font-size:10px; margin-top:8px;}
  .installbar .close{ background:none; color: var(--ink-soft); border:none; font-size:16px; padding:0; margin-left:auto; }

  @media (prefers-reduced-motion: reduce){
    .authorcard, .fab{ transition:none; }
  }
  /* ---------- Schriftgrößen-Skalierung ---------- */
  html[data-fontscale="gross"] body{ font-size: 112%; }
  html[data-fontscale="riesig"] body{ font-size: 128%; }

  /* ---------- Suche ---------- */
  .searchbox{
    width:100%; border: 1px solid var(--rule); border-radius: 12px; background: var(--card);
    padding: 12px 14px; font-family:"Source Serif 4", serif; font-size:15px; color: var(--ink);
  }

  /* ---------- Schriftgrößen-Button ---------- */
  .fontbtn{
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 8px 12px; font-family:"Fraunces", serif; font-weight:600; font-size: 14px; color: var(--wine-deep);
    align-self: center;
  }

  /* ---------- Vorlesen ---------- */
  .speakbtn{
    background: none; border: 1px solid var(--rule); border-radius: 20px; padding: 6px 12px;
    font-family:"Space Mono", monospace; font-size: 10.5px; color: var(--wine); margin-top: 10px;
  }

  /* ---------- Wikisource-Explorer ---------- */
  .wikisource-box{
    margin: 20px 0; background: var(--card); border-radius: 14px; padding: 16px;
    box-shadow: var(--shadow);
  }
  .wikisource-box h3{ font-size: 15px; margin: 0 0 6px; color: var(--wine-deep); }
  .wiki-hint{ font-size: 12px; color: var(--ink-soft); line-height:1.55; margin-bottom: 10px; }
  .loadbtn{
    background: var(--wine); color: var(--paper); border:none; border-radius: 10px;
    padding: 11px 16px; font-family:"Space Mono", monospace; font-size: 11px; text-transform: uppercase;
  }
  .wiki-results{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .wiki-results button{
    width:100%; text-align:left; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
    padding: 10px 12px; display:flex; flex-direction:column; gap:3px;
  }
  .wr-title{ font-family:"Fraunces", serif; font-weight:600; font-size: 13.5px; color: var(--ink); }
  .wr-snip{ font-size: 11px; color: var(--ink-soft); line-height:1.4; }
  .wiki-fulltext{
    font-family:"Fraunces", serif; font-style: italic; white-space: pre-line; line-height:1.8;
    font-size: 14.5px; margin-top: 14px; max-height: 50vh; overflow-y:auto;
  }

  /* ---------- Aphorismen ---------- */
  .today-aphorism{
    background: var(--wine); color: var(--paper); border-radius: 16px; padding: 20px 20px 16px;
    margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .today-aphorism blockquote{
    margin: 8px 0 6px; font-family:"Fraunces", serif; font-style:italic; font-weight:500;
    font-size: 19px; line-height:1.5;
  }
  .today-aphorism cite{ font-family:"Space Mono", monospace; font-style:normal; font-size:11px; opacity:0.85; }
  .today-aphorism .speakbtn{ border-color: rgba(245,241,220,0.4); color: var(--paper); }
  .aphorism-card{ margin: 0 0 18px; padding-left: 16px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel-source" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

/* =========================================================
   DATENGRUNDLAGE
   pd = true  -> gemeinfrei (Autor > 70 Jahre verstorben), Volltext-Auszug möglich
   pd = false -> noch urheberrechtlich geschützt, nur kurzes, zugeschriebenes Zitat + Link zu legalen Quellen
   ========================================================= */
const TAGS = ["Leben", "Liebe", "Vertrauen", "Glück", "Verlust", "Natur", "Erinnerung", "Heimat", "Humor", "Alter", "Hoffnung"];

const AUTHORS = [
  {
    id: "kaleko",
    name: "Mascha Kaléko",
    era: "Moderne / Exil",
    born: 1907, died: 1975,
    pd: false,
    bio: [
      "Mascha Kaléko wurde 1907 in Galizien geboren und wuchs später in Berlin auf, wo sie in den 1920er- und frühen 1930er-Jahren zu einer der eigenständigsten Stimmen der literarischen Moderne wurde.",
      "Ihre Gedichte sprechen mit leichtem Ton über schwere Dinge — Großstadtleben, Liebe, Heimatlosigkeit. 1938 floh sie vor dem NS-Regime über Prag in die USA, später lebte sie in Jerusalem.",
      "Bis heute gehört sie zu den meistgelesenen deutschsprachigen Lyrikerinnen des 20. Jahrhunderts."
    ],
    quotes: [
      { text: "Man muss so wenig brauchen und so viel geben können.", cite: "zugeschrieben, sinngemäß nach Kaléko", theme: "Glück" },
      { text: "Es ist, was es ist, sagt die Liebe.", cite: "aus „Chor der Kriegerwaisen“ (Zeile, sinngemäß)", theme: "Liebe" }
    ],
    links: [
      { label: "dtv Verlag", url: "https://www.dtv.de" },
      { label: "Lyrikline", url: "https://www.lyrikline.org" }
    ]
  },
  {
    id: "goethe",
    name: "Johann Wolfgang von Goethe",
    era: "Klassik",
    born: 1749, died: 1832,
    pd: true,
    bio: [
      "Goethe war Dichter, Naturforscher und Staatsmann und prägte mit Werken wie „Faust“ und dem „West-östlichen Divan“ die deutsche Literatur wie kaum ein Zweiter.",
      "Seine Naturlyrik verbindet genaue Beobachtung mit stiller, oft meditativer Tiefe."
    ],
    poems: [
      { title: "Wandrers Nachtlied", theme: "Leben",
        text: "Über allen Gipfeln\nIst Ruh,\nIn allen Wipfeln\nSpürest du\nKaum einen Hauch;\nDie Vögelein schweigen im Walde.\nWarte nur, balde\nRuhest du auch." }
    ],
    links: [{ label: "Deutsches Textarchiv", url: "https://www.deutschestextarchiv.de" }]
  },
  {
    id: "schiller",
    name: "Friedrich Schiller",
    era: "Klassik",
    born: 1759, died: 1805,
    pd: true,
    bio: [
      "Schiller war Dichter, Dramatiker und Philosoph, eng befreundet mit Goethe. Seine Balladen und die „Ode an die Freude“ zählen zu den bekanntesten Texten der deutschen Sprache.",
      "In seinen Werken verbindet er große moralische Fragen mit klarer, kraftvoller Form."
    ],
    quotes: [
      { text: "Der Mensch ist frei, und wär er in Ketten geboren.", cite: "aus „Die Worte des Glaubens“", theme: "Leben" },
      { text: "Freundschaft ist der Freundschaft einzger Preis.", cite: "aus „Die Bürgschaft“ (sinngemäß)", theme: "Vertrauen" }
    ],
    links: [{ label: "Zeno.org", url: "https://www.zeno.org" }, { label: "Projekt Gutenberg-DE", url: "https://www.projekt-gutenberg.org" }]
  },
  {
    id: "heine",
    name: "Heinrich Heine",
    era: "Romantik / Vormärz",
    born: 1797, died: 1856,
    pd: true,
    bio: [
      "Heine gilt als einer der letzten großen Dichter der Romantik und zugleich als ihr schärfster Kritiker. Seine Lieder wurden von Schubert, Schumann und vielen anderen vertont.",
      "Sein Witz und seine Melancholie liegen oft in ein und demselben Vers."
    ],
    poems: [
      { title: "Die Lorelei (erste Strophe)", theme: "Liebe",
        text: "Ich weiß nicht, was soll es bedeuten,\nDaß ich so traurig bin;\nEin Märchen aus alten Zeiten,\nDas kommt mir nicht aus dem Sinn." }
    ],
    links: [{ label: "Deutsches Textarchiv", url: "https://www.deutschestextarchiv.de" }]
  },
  {
    id: "rilke",
    name: "Rainer Maria Rilke",
    era: "Moderne",
    born: 1875, died: 1926,

function gutenbergLinks(author) {
  const q = encodeURIComponent(author.name);
  return [
    { label: "Projekt Gutenberg-DE", url: "https://www.projekt-gutenberg.org/info/texte/autoren.html" },
    { label: "Gutenberg.org (international)", url: `https://www.gutenberg.org/ebooks/search/?query=${q}` },
    { label: "Wikisource-Suche", url: `https://de.wikisource.org/w/index.php?search=${q}` }
  ];
}

async function wikisourceSearch(name) {
  const url = `https://de.wikisource.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(name)}&format=json&origin=*&srlimit=20`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Netzwerkfehler");
  const data = await res.json();
  return (data.query && data.query.search) || [];
}

function stripHtml(s) {
  return s.replace(/<[^>]+>/g, "");
}

async function wikisourceExtract(title) {
  const url = `https://de.wikisource.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(title)}&format=json&origin=*`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Netzwerkfehler");
  const data = await res.json();
  const pages = data.query && data.query.pages;
  if (!pages) return "";
  const page = Object.values(pages)[0];
  return (page && page.extract) || "";
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function SpeakButton({ text }) {
  const [speaking, setSpeaking] = useState(false);
  if (!("speechSynthesis" in window)) return null;
  const toggle = () => {
    if (speaking) { window.speechSynthesis.cancel(); setSpeaking(false); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    u.rate = 0.95;
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    setSpeaking(true);
    window.speechSynthesis.speak(u);
  };
  return (
    <button className="speakbtn" onClick={toggle} aria-label="Vorlesen">
      {speaking ? "⏸ Stopp" : "🔊 Vorlesen"}
    </button>
  );
}

function WikisourceExplorer({ author }) {
  const [status, setStatus] = useState("idle"); // idle | loading | done | error
  const [results, setResults] = useState([]);
  const [reading, setReading] = useState(null); // { title, text, status }

  const load = async () => {
    setStatus("loading");
    try {
      const r = await wikisourceSearch(author.name);
      setResults(r);
      setStatus("done");
    } catch (e) {
      setStatus("error");
    }
  };

  const openText = async (title) => {
    setReading({ title, text: "", status: "loading" });
    try {
      const text = await wikisourceExtract(title);
      setReading({ title, text: text || "Kein Text gefunden.", status: "done" });
    } catch (e) {
      setReading({ title, text: "", status: "error" });
    }
  };

  return (
    <div className="wikisource-box">
      <h3>Mehr auf Wikisource entdecken</h3>
      <p className="wiki-hint">Lädt zusätzliche gemeinfreie Werke live von de.wikisource.org — dafür ist eine Internetverbindung nötig.</p>

      {status === "idle" && <button className="loadbtn" onClick={load}>Werke laden</button>}
      {status === "loading" && <div className="wiki-hint">Lädt …</div>}
      {status === "error" && (
        <div className="wiki-hint">Konnte gerade nichts laden — bitte Internetverbindung prüfen und erneut versuchen.<br/><button className="loadbtn" onClick={load}>Erneut versuchen</button></div>
      )}
      {status === "done" && results.length === 0 && <div className="wiki-hint">Keine Treffer auf Wikisource gefunden.</div>}
      {status === "done" && results.length > 0 && (
        <ul className="wiki-results">
          {results.map((r, i) => (
            <li key={i}>
              <button onClick={() => openText(r.title)}>
                <span className="wr-title">{r.title}</span>
                <span className="wr-snip">{stripHtml(r.snippet || "")}</span>
              </button>
            </li>
          ))}
        </ul>
      )}

      {reading && (
        <div className="sheet-overlay" onClick={(e) => { if (e.target === e.currentTarget) setReading(null); }}>
          <div className="sheet">
            <div className="sheet-handle"></div>
            <h2>{reading.title}</h2>
            {reading.status === "loading" && <div className="wiki-hint">Lädt Text …</div>}
            {reading.status === "error" && <div className="wiki-hint">Text konnte nicht geladen werden.</div>}
            {reading.status === "done" && (
              <React.Fragment>
                <SpeakButton text={reading.text.slice(0, 4000)} />
                <div className="wiki-fulltext">{reading.text}</div>
              </React.Fragment>
            )}
            <button className="cancel-btn" onClick={() => setReading(null)}>Schließen</button>
          </div>
        </div>
      )}
    </div>
  );
}

  const d = new Date();
  const seed = d.getFullYear() * 1000 + Math.ceil((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return seed % len;
}

/* =========================================================
   SPRACHEINGABE — Web Speech API
   ========================================================= */
function useSpeechRecognition(onResult) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const recRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const rec = new SR();
    rec.lang = "de-DE";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let text = "";
      for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      onResult(text);
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
  }, []);

  const start = () => {
    if (!recRef.current) return;
    setListening(true);
    recRef.current.start();
  };
  const stop = () => {
    if (!recRef.current) return;
    recRef.current.stop();
    setListening(false);
  };
  return { listening, supported, start, stop };
}

/* =========================================================
   KAMERA / OCR — Tesseract.js (lazy geladen)
   ========================================================= */
function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve(window.Tesseract);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => resolve(window.Tesseract);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

/* =========================================================
   EDITOR — neues / bearbeitetes Gedicht
   ========================================================= */
function PoemEditor({ initial, onSave, onClose }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [text, setText] = useState(initial?.text || "");
  const [tags, setTags] = useState(initial?.tags || []);
  const [source, setSource] = useState(initial?.source || "text");
  const [ocrStatus, setOcrStatus] = useState("");
  const [photoPreview, setPhotoPreview] = useState(null);
  const fileInputRef = useRef(null);

  const speech = useSpeechRecognition((t) => setText(t));

  const toggleTag = (t) => {
    setTags(tags.includes(t) ? tags.filter(x => x !== t) : [...tags, t]);
  };

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setSource("kamera");
    const url = URL.createObjectURL(file);
    setPhotoPreview(url);
    setOcrStatus("Texterkennung läuft …");
    try {
      const Tesseract = await loadTesseract();
      const { data } = await Tesseract.recognize(file, "deu");
      setText(data.text.trim());
      setOcrStatus("Vorschlag eingefügt — bitte kurz gegenprüfen und korrigieren.");
    } catch (err) {
      setOcrStatus("Texterkennung fehlgeschlagen. Bitte den Text von Hand abtippen.");
    }
  };

  const handleSave = () => {
    if (!text.trim()) return;
    onSave({
      id: initial?.id || uid(),
      title: title.trim() || "Ohne Titel",
      text: text.trim(),
      tags,
      source,
      inspiredBy: initial?.inspiredBy || null,
      createdAt: initial?.createdAt || new Date().toISOString().slice(0, 10)
    });
  };

  return (
    <div className="sheet-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet">
        <div className="sheet-handle"></div>
        <h2>{initial?.id ? "Gedicht bearbeiten" : "Neues Gedicht"}</h2>

        {initial?.inspiredBy && (
          <div className="pd-note" style={{marginTop:0}}>Gewidmet: {initial.inspiredBy}</div>
        )}

        <div className="field">
          <label>Titel</label>
          <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="z. B. Abendlicht" />
        </div>

        <div className="inputrow">
          <button
            className={"chipbtn" + (speech.listening ? " recording" : "")}
            onClick={() => { setSource("sprache"); speech.listening ? speech.stop() : speech.start(); }}
            disabled={!speech.supported}
          >
            <span className="ic">{speech.listening ? "◉" : "🎙"}</span>
            {speech.supported ? (speech.listening ? "Aufnahme läuft…" : "Sprechen") : "Nicht verfügbar"}
          </button>
          <button className="chipbtn" onClick={() => fileInputRef.current.click()}>
            <span className="ic">📷</span>
            Foto / Scan
          </button>
          <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handlePhoto} />
        </div>

        {photoPreview && <img className="photo-preview" src={photoPreview} alt="Foto des Gedichts" />}
        {ocrStatus && <div className="ocr-status">{ocrStatus}</div>}

        <div className="field">
          <label>Text</label>
          <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Hier entsteht dein Gedicht — getippt, gesprochen oder abfotografiert." />
        </div>

        <div className="field">
          <label>Stimmung / Thema</label>
          <div className="tagpicker">
            {TAGS.map(t => (
              <button key={t} className={tags.includes(t) ? "on" : ""} onClick={() => toggleTag(t)}>{t}</button>
            ))}
          </div>
        </div>

        <button className="save-btn" onClick={handleSave}>Gedicht sichern</button>
        <button className="cancel-btn" onClick={onClose}>Abbrechen</button>
      </div>
    </div>
  );
}

/* =========================================================
   MEINE GEDICHTE
   ========================================================= */
function MyPoems({ poems, setPoems, editorInit, setEditorInit }) {
  const [showEditor, setShowEditor] = useState(false);

  useEffect(() => { if (editorInit) setShowEditor(true); }, [editorInit]);

  const openNew = () => { setEditorInit(null); setShowEditor(true); };
  const openEdit = (p) => { setEditorInit(p); setShowEditor(true); };
  const remove = (id) => { setPoems(poems.filter(p => p.id !== id)); };

  const handleSave = (poem) => {
    const exists = poems.some(p => p.id === poem.id);
    const next = exists ? poems.map(p => p.id === poem.id ? poem : p) : [poem, ...poems];
    setPoems(next);
    setShowEditor(false);
    setEditorInit(null);
  };

  const exportPoems = () => {
    const blob = new Blob([JSON.stringify(poems, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "meine-gedichte.json"; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <main>
      <p className="eyebrow">Archiv</p>
      <h1 className="pagetitle">Meine Gedichte</h1>
      <p className="pagesub">Getippt, gesprochen oder mit der Kamera eingefangen — alles an einem Ort, nur für dich.</p>

      {poems.length === 0 && (
        <div className="empty">
          <div className="ic">❦</div>
          <p>Noch kein Gedicht gesichert. Tippe unten rechts auf das Plus, um dein erstes einzutragen — von Hand, per Sprache oder mit einem Foto.</p>
        </div>
      )}

      {poems.map(p => (
        <div className="poemcard" key={p.id}>
          <div className="rowbtns">
            <button className="iconbtn" onClick={() => openEdit(p)}>✎</button>
            <button className="iconbtn" onClick={() => remove(p.id)}>✕</button>
          </div>
          <h3>{p.title}</h3>
          <div className="meta">
            <span>{p.createdAt}</span>
            <span className="src">{p.source === "sprache" ? "Sprachaufnahme" : p.source === "kamera" ? "Foto-Scan" : "Text"}</span>
          </div>
          <div className="text">{p.text}</div>
          {p.tags?.length > 0 && (
            <div className="tags">
              {p.tags.map(t => <span className="tagchip" key={t}>{t}</span>)}
            </div>
          )}
          {p.inspiredBy && <div className="inspired">✒︎ gewidmet: {p.inspiredBy}</div>}
        </div>
      ))}

      {poems.length > 0 && (
        <button className="cancel-btn" style={{marginTop: 6}} onClick={exportPoems}>↓ Als Datei sichern</button>
      )}

      <button className="fab" onClick={openNew} aria-label="Neues Gedicht">+</button>

      {showEditor && (
        <PoemEditor
          initial={editorInit}
          onSave={handleSave}
          onClose={() => { setShowEditor(false); setEditorInit(null); }}
        />
      )}
    </main>
  );
}

/* =========================================================

function Timeline({ poems }) {
  const items = useMemo(() => {
    const a = AUTHORS.map(x => ({
      kind: "author", year: x.born, sortYear: x.born,
      title: x.name, desc: `${x.born}–${x.died} · ${x.era}`
    }));
    const p = poems.map(x => ({
      kind: "mine", year: x.createdAt, sortYear: parseInt(x.createdAt.slice(0,4)) || 2026,
      title: x.title, desc: x.inspiredBy ? `Eigenes Gedicht · gewidmet ${x.inspiredBy}` : "Eigenes Gedicht"
    }));
    return [...a, ...p].sort((m, n) => n.sortYear - m.sortYear);
  }, [poems]);

  return (
    <main>
      <p className="eyebrow">Dialog der Zeiten</p>
      <h1 className="pagetitle">Zeitleiste</h1>

}

  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

  if (dismissed || isStandalone) return null;

  const dismiss = () => { setDismissed(true); localStorage.setItem("literatura.installDismissed", "1"); };

  return (
    <div className="installbar">

/* =========================================================
   APP ROOT
   ========================================================= */
function App() {
  const [tab, setTab] = useState("autoren");
  const [openAuthorId, setOpenAuthorId] = useState(null);
  const [poems, setPoems] = useState(loadPoems());
  const [editorInit, setEditorInit] = useState(null);
  const [fontScale, setFontScale] = useState(() => {
    try { return localStorage.getItem("literatura.fontScale") || "normal"; } catch (e) { return "normal"; }
  });

  useEffect(() => { savePoems(poems); }, [poems]);

  useEffect(() => {
    document.documentElement.setAttribute("data-fontscale", fontScale);
    try { localStorage.setItem("literatura.fontScale", fontScale); } catch (e) {}
  }, [fontScale]);

  useEffect(() => {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  }, []);

  const openAuthor = (id) => setOpenAuthorId(id);
  const backToAuthors = () => setOpenAuthorId(null);
  const dedicate = (author) => {
    setEditorInit({ inspiredBy: author.name, tags: [], source: "text", title: "", text: "" });
    setTab("gedichte");
    setOpenAuthorId(null);
  };

  const author = AUTHORS.find(a => a.id === openAuthorId);
  const cycleFont = () => {
    setFontScale(fontScale === "normal" ? "gross" : fontScale === "gross" ? "riesig" : "normal");
  };

  return (
    <React.Fragment>
      <header className="topbar">
        <div>
          <div className="word">Sylvia's Gedichteecke<span>.</span></div>
          <div className="sub">Gedichte &amp; Dichter</div>
        </div>
        <button className="fontbtn" onClick={cycleFont} aria-label="Schriftgröße ändern" title="Schriftgröße ändern">
          Aa
        </button>
      </header>

      {tab === "autoren" && !author && (
        <React.Fragment>
          <div style={{padding: "18px 20px 0"}}><InstallBanner /></div>
          <AuthorsList onOpen={openAuthor} />
        </React.Fragment>
      )}
      {tab === "autoren" && author && (
        <AuthorDetail author={author} onBack={backToAuthors} onDedicate={dedicate} />
      )}
      {tab === "aphorismen" && <AphorismList />}
      {tab === "gedichte" && (
        <MyPoems poems={poems} setPoems={setPoems} editorInit={editorInit} setEditorInit={setEditorInit} />
      )}
      {tab === "zeit" && <Timeline poems={poems} />}

      <TabBar tab={tab} setTab={(t) => { setTab(t); setOpenAuthorId(null); }} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

<script>
  // Wir transpilieren bewusst manuell mit erzwungener "classic"-JSX-Runtime
  // (statt der automatischen data-presets-Verarbeitung von Babel Standalone),
  // weil neuere Babel-Versionen sonst react/jsx-dev-runtime-Imports erzeugen,
  // die ohne Bundler im Browser nicht laufen — das führte zur leeren, weißen Seite.
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    var script = document.createElement("script");
    script.text = output;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
